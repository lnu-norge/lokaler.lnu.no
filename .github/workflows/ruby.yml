name: Main

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    # If you need DB like PostgreSQL, Redis then define service below.
    # https://github.com/actions/example-services/tree/master/.github/workflows
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "password"
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        # tmpfs makes DB faster by using RAM. Mounted at /var/lib/postgresql
        # rather than .../data: from 18 on, these images keep data in a
        # major-version subdirectory and refuse to start if the old path is
        # mounted. See https://github.com/docker-library/postgres/pull/1259
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      PGHOST: localhost
      POSTGRES_HOST: localhost
      PGUSER: postgres
      POSTGRES_USER: postgres
      PGPASSWORD: "password"
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: postgres
      POSTGRES_PORT: 5432
      # Rails verifies the time zone in DB is the same as the time zone of the Rails app
      TZ: "Europe/Warsaw"
      MAPBOX_API_KEY: pk.eyJ1IjoibWF0aGlhczIzNCIsImEiOiJja3U1N2o0MGoybGl5MnVxaDcyaHdjZDFpIn0.S-c3HtdhqhyAR6izLxY-iQ

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'

      # image_processing 2.0 no longer bundles a backend, so ruby-vips is an
      # explicit dependency and loads libvips.so.42 at boot. The runner image
      # does not ship it. Production has it via the Dockerfile.
      - name: Install libvips
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libvips

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # runs 'bundle install' and caches installed gems automatically
          bundler-cache: true
      # Node 25 dropped the bundled Corepack, which is what provides the yarn
      # binary matching packageManager in package.json.
      - name: Enable Corepack
        run: |
          npm install -g corepack@latest
          corepack enable

      - name: Run Yarn and build js and css
        run: |
          yarn install --immutable
          yarn build
          yarn build:css

      - name: Create DB
        run: |
          cp config/database.yml.example config/database.yml
          bin/rails db:prepare
      - name: Rubocop
        run: |
          bundle exec rubocop

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-ruby-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright browser deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run tests
        run: |
          bundle exec rspec
