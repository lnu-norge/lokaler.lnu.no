plugins:
  - rubocop-performance
  - rubocop-rails
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-capybara

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Exclude:
    - 'config/routes.rb'

Style/StringLiterals:
  EnforcedStyle: double_quotes # To always allow #{interpolation}, and reduce fatigue from changing strings

Rails/HasAndBelongsToMany:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/NestedGroups:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

Rails/ReflectionClassName:
  Enabled: false

Metrics/BlockLength:
  Enabled: true
  Exclude:
    - 'spec/**/*'
    - 'db/migrate/*'

Metrics/MethodLength:
  Max: 20
  Exclude:
    - 'db/migrate/*'

Rails/EnvironmentVariableAccess:
  Enabled: false

AllCops:
  NewCops: enable
  Exclude:
    - 'config/initializers/devise.rb'
    - 'db/schema.rb'
    - 'node_modules/**/*'
    - 'bin/**/*'
    - 'tmp/**/*'
    - 'Guardfile'
    - 'spec/rails_helper.rb'
    - 'db/migrate/**/*'
    - 'db/schema.rb'
    - 'db/queue_schema.rb'
    - 'db/cache_schema.rb'
    - 'db/cable_schema.rb'
    - 'vendor/**/*'

Style/SymbolArray:
  MinSize: 4
  Exclude:
    - 'config/routes.rb'

Metrics/AbcSize:
  Max: 20

RSpec/DescribeClass:
  Exclude:
    - 'spec/features/**/*'

# Ref discussion here: https://github.com/rubocop/rubocop-rspec/pull/1365
# InferredSpecType is going to be depreciated, and causes problems for view files together with DescribeClass
RSpecRails/InferredSpecType:
  Enabled: false

# params.expect raises ParameterMissing (400) where params[:x] returned nil (404 via
# RecordNotFound). Adopting it is a deliberate behaviour change, not an upgrade concern —
# left disabled so the dependency upgrade stays behaviour-neutral. Worth revisiting on its own.
Rails/StrongParametersExpect:
  Enabled: false

# The benchmark helper's whole job is to print timings to the console
RSpec/Output:
  Exclude:
    - 'spec/support/performance_benchmark.rb'

# Request specs are named after the controller they exercise, not the model they describe
RSpec/SpecFilePathFormat:
  Exclude:
    - 'spec/requests/**/*'
